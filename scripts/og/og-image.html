<!doctype html>
<!-- Source for public/og-image.png (1200×630 link preview). Regenerate with
     `node scripts/og/render-og-image.mjs` after editing -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Roboto+Mono:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Roboto Mono', 'Noto Sans TC', monospace;
        background: radial-gradient(circle at 85% 20%, #1f3d6b 0%, #152036 55%);
        color: #e6e9ec;
        padding: 72px 80px;
        position: relative;
      }
      .eyebrow {
        font-size: 22px;
        letter-spacing: 0.18em;
        color: #58b2dc;
        font-weight: 700;
      }
      h1 {
        margin-top: 22px;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #fff;
      }
      .zh {
        display: flex;
        margin-top: 14px;
        font-family: 'Noto Sans TC', sans-serif;
        font-size: 40px;
        font-weight: 700;
        color: #c2c7cb;
      }
      .zh span {
        color: #58b2dc;
      }
      .tiers {
        position: absolute;
        left: 80px;
        bottom: 72px;
        display: flex;
        gap: 14px;
      }
      .pill {
        width: 74px;
        height: 56px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 700;
      }
      .s {
        background: #fecaca;
        color: #b91c1c;
      }
      .a {
        background: #fed7aa;
        color: #c2410c;
      }
      .b {
        background: #fde68a;
        color: #b45309;
      }
      .c {
        background: #bbf7d0;
        color: #15803d;
      }
      .d {
        background: #bfdbfe;
        color: #1d4ed8;
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 84px;
        font-size: 24px;
        color: #a7acb1;
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 10px;
        background: linear-gradient(90deg, #2b6cb0, #805ad5, #e53e3e, #cbd5e0, #38a169);
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <p class="eyebrow">GUNDAM CARD GAME · TOURNAMENT META</p>
    <h1>GCG Decks Analysis</h1>
    <p class="zh">
      GCG 卡組分析
      <span>｜</span>
      高達卡牌遊戲賽事環境
    </p>
    <div class="tiers">
      <div class="pill s">S</div>
      <div class="pill a">A</div>
      <div class="pill b">B</div>
      <div class="pill c">C</div>
      <div class="pill d">D</div>
    </div>
    <p class="url">gcg.jamwong.me</p>
  </body>
</html>
